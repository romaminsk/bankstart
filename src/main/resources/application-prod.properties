# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║           BankStart MVP - Production Configuration                             ║
# ║                                                                                ║
# ║  Активация: java -jar app.jar --spring.profiles.active=prod                   ║
# ║  Или через переменную окружения: SPRING_PROFILES_ACTIVE=prod                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────────────────────────
# DATABASE - PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────────
# ВАЖНО: Пароли через переменные окружения, НЕ в коде!
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bankstart}
spring.datasource.username=${DB_USERNAME:bankstart}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─────────────────────────────────────────────────────────────────────────────────
# JPA - Production Settings
# ─────────────────────────────────────────────────────────────────────────────────
# НИКОГДА не используйте create/update в production!
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─────────────────────────────────────────────────────────────────────────────────
# THYMELEAF - Production Settings
# ─────────────────────────────────────────────────────────────────────────────────
# Включаем кэширование шаблонов
spring.thymeleaf.cache=true

# ─────────────────────────────────────────────────────────────────────────────────
# H2 Console - ОТКЛЮЧЕНО в production
# ─────────────────────────────────────────────────────────────────────────────────
spring.h2.console.enabled=false

# ─────────────────────────────────────────────────────────────────────────────────
# LOGGING - Production Settings
# ─────────────────────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.by.bank.bankstart=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN
