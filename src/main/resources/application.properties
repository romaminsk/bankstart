# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║               BankStart MVP - Main Configuration                               ║
# ║                                                                                ║
# ║  Этот файл содержит настройки по умолчанию для всех профилей.                  ║
# ║  Профиль-специфичные настройки в: application-{profile}.properties             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────────────────────────
# APPLICATION INFO
# ─────────────────────────────────────────────────────────────────────────────────
# Информация доступна через Actuator: /actuator/info
spring.application.name=BankStart MVP
info.app.name=BankStart MVP
info.app.description=Калькулятор финансовой устойчивости для малого бизнеса
info.app.version=1.0.0-SNAPSHOT

# ─────────────────────────────────────────────────────────────────────────────────
# SERVER SETTINGS
# ─────────────────────────────────────────────────────────────────────────────────
# Порт по умолчанию (можно переопределить: SERVER_PORT=9000 java -jar app.jar)
server.port=8080

# Включаем сжатие ответов (уменьшает трафик на 60-80%)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.compression.min-response-size=1024

# Кодировка сервера
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ─────────────────────────────────────────────────────────────────────────────────
# DATABASE - H2 (Development Mode)
# ─────────────────────────────────────────────────────────────────────────────────
# ПОЧЕМУ H2 для разработки?
# - Не требует установки отдельного сервера
# - Автоматически создает/пересоздает схему при старте
# - Встроенная веб-консоль для отладки
# - Режим совместимости с PostgreSQL

# URL подключения:
# - mem:bankstart - in-memory база (данные теряются при перезапуске)
# - MODE=PostgreSQL - эмуляция PostgreSQL синтаксиса
# - DB_CLOSE_DELAY=-1 - не закрывать БД при отключении всех сессий
spring.datasource.url=jdbc:h2:mem:bankstart;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console - веб-интерфейс для просмотра БД
# Доступен по адресу: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─────────────────────────────────────────────────────────────────────────────────
# JPA / HIBERNATE SETTINGS
# ─────────────────────────────────────────────────────────────────────────────────
# ПОЧЕМУ эти настройки важны?
# JPA (Java Persistence API) - стандарт ORM
# Hibernate - самая популярная реализация JPA

# ddl-auto options:
# - none: ничего не делать (production)
# - validate: проверить схему, не изменять
# - update: обновить схему (ОПАСНО в production!)
# - create: создать схему, удалить данные при старте
# - create-drop: создать при старте, удалить при остановке
spring.jpa.hibernate.ddl-auto=create-drop

# Показывать SQL запросы в консоли (для отладки)
spring.jpa.show-sql=true

# Форматировать SQL для читаемости
spring.jpa.properties.hibernate.format_sql=true

# Добавлять комментарии к SQL (откуда вызван запрос)
spring.jpa.properties.hibernate.use_sql_comments=true

# Диалект базы данных (оптимизация запросов под PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Отложенная инициализация (быстрый старт)
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────────────────────────────
# THYMELEAF SETTINGS
# ─────────────────────────────────────────────────────────────────────────────────
# ПОЧЕМУ Thymeleaf?
# - Natural templates (валидный HTML даже без сервера)
# - Интеграция со Spring Expression Language (SpEL)
# - Фрагменты и layouts для переиспользования
# - i18n из коробки

# Отключаем кэширование шаблонов (для разработки)
# В production: spring.thymeleaf.cache=true
spring.thymeleaf.cache=false

# Режим обработки
spring.thymeleaf.mode=HTML

# Кодировка шаблонов
spring.thymeleaf.encoding=UTF-8

# Префикс и суффикс для поиска шаблонов
# return "index" → templates/index.html
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ─────────────────────────────────────────────────────────────────────────────────
# LOGGING SETTINGS
# ─────────────────────────────────────────────────────────────────────────────────
# ПОЧЕМУ логирование важно?
# - Отладка проблем
# - Аудит операций (требование ИБ)
# - Мониторинг производительности

# Уровни логирования: TRACE < DEBUG < INFO < WARN < ERROR

# Общий уровень - INFO (production-ready)
logging.level.root=INFO

# Наше приложение - DEBUG (видим все детали)
logging.level.by.bank.bankstart=DEBUG

# SQL запросы от Hibernate (для отладки)
logging.level.org.hibernate.SQL=DEBUG

# Параметры SQL запросов (TRACE - очень подробно, осторожно с паролями!)
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Spring MVC (запросы/ответы)
logging.level.org.springframework.web=DEBUG

# Формат логов (timestamp, level, logger, message)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%5level] %logger{36} - %msg%n

# ─────────────────────────────────────────────────────────────────────────────────
# ACTUATOR (MONITORING)
# ─────────────────────────────────────────────────────────────────────────────────
# Actuator предоставляет endpoints для мониторинга

# Включаем основные endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Health check показывает детали (компоненты, БД)
management.endpoint.health.show-details=when-authorized

# ─────────────────────────────────────────────────────────────────────────────────
# BANKSTART CUSTOM SETTINGS
# ─────────────────────────────────────────────────────────────────────────────────
# Кастомные настройки приложения (читаются через @ConfigurationProperties)

# Monte Carlo симуляция
bankstart.simulation.iterations=1000
bankstart.simulation.months=12
bankstart.simulation.parallel=true

# Feature flags
bankstart.features.extended-mode-enabled=true
bankstart.features.ai-summary-enabled=false
